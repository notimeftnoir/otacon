[project]
name = "otacon"
version = "1.0.0"
description = "Domain impersonation detector — typosquatting, homoglyph & combosquat detection."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gabriel" }]
keywords = [
    "security", "typosquatting", "osint", "phishing",
    "domain-monitoring", "pentest", "blue-team", "threat-intelligence",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0,<1",
    "rich>=13.7.0,<16",
    "httpx>=0.27.0,<1",
    "httpcore>=1.0.0,<2",
    "cryptography>=42.0.0,<51",
    "aiodns>=3.1.0,<5",
    "pydantic>=2.6.0,<3",
    "questionary>=2.0.0,<3",
    "prompt_toolkit>=3.0.0,<4",
    "asyncwhois>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # <9.0.3 carries CVE-2025-71176 (predictable /tmp dir on UNIX)
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.20.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "interrogate>=1.7.0",
    "bandit>=1.9.4",  # <1.9.4 crashes on Python 3.14 (ast.Constant.s removed)
    "types-setuptools",
    "build>=1.0.0",
]

[project.scripts]
otacon = "otacon.cli:app"

[project.urls]
Homepage = "https://github.com/notimeftnoir/otacon"
Repository = "https://github.com/notimeftnoir/otacon"
Issues = "https://github.com/notimeftnoir/otacon/issues"
Changelog = "https://github.com/notimeftnoir/otacon/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otacon = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B",
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",  # asserts are fine — pytest depends on them
    "S311",  # we never use `random` for crypto; secrets.token_hex covers nonces
    # RUF001/003 fire on UI glyphs (›, –, ×) that are intentionally non-ASCII —
    # use noqa for the rare false positive instead of disabling the rule globally.
]

[tool.ruff.lint.per-file-ignores]
"cli.py" = ["B008"]
"tests/*" = ["S", "N802", "N806", "SIM117"]  # tests exercise edge cases; CamelCase mocks OK

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: live-network regression tests, excluded by default (run: pytest -m network)",
]
addopts = "-m 'not network'"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.interrogate]
fail-under = 80
verbose = 1
quiet = false
ignore-init-method = true
ignore-magic = true
ignore-nested-functions = true
ignore-nested-classes = true
# `__main__.py` is a 3-line shim; private helpers + setter/property are docs in
# the surrounding type signatures.
exclude = ["src/otacon/__main__.py", "tests"]
