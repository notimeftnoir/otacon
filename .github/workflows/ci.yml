name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default to read-only GITHUB_TOKEN for every job.
permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (c-ares for aiodns)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      - name: Install package + dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type-check (mypy --strict)
        run: mypy --strict src/otacon

      - name: Docstring coverage (interrogate)
        run: interrogate -c pyproject.toml src/otacon

      - name: Security lint (bandit)
        # Confidence/severity filter to medium+: noqa-annotated false positives
        # (e.g. verify=False) are already justified in code; we just don't want
        # CI noise from "low" picks.
        run: bandit -r src/otacon -ll -ii

      - name: Test (pytest + branch coverage)
        run: pytest --cov=src/otacon --cov-branch --cov-fail-under=85

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit pinned dependencies
        run: pip-audit -r requirements.txt

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: pip install build

      - name: Build wheel + sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (c-ares for aiodns)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      - name: Install project + cyclonedx-bom
        run: |
          pip install -e .
          pip install 'cyclonedx-bom>=7,<8'  # CLI flags change across majors

      - name: Generate SBOM (JSON)
        run: cyclonedx-py environment --output-format JSON --output-file otacon-sbom.cdx.json

      - name: Generate SBOM (XML)
        run: cyclonedx-py environment --output-format XML --output-file otacon-sbom.cdx.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sbom
          path: otacon-sbom.cdx.*
