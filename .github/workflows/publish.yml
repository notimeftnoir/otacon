name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the publish job opts into the OIDC token it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Requires a protected GitHub Environment named "pypi" (add reviewers there
    # to gate releases). Also where PyPI Trusted Publishing is configured.
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing (no API token needed)
      contents: write   # attach the signed distributions to the GitHub release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches the package version
        # A tag that disagrees with pyproject.toml would attach the previous
        # version's files to this release and un-draft it, and only then fail
        # at the PyPI upload (that version already exists). Stop before any of it.
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Install dev extras (run tests before publish)
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Run tests
        run: pytest

      - name: Build distribution
        # `build` is already present from the hash-pinned dev install above;
        # re-installing it here would be an unpinned dependency.
        run: python -m build

      - name: Sign distribution with Sigstore (keyless OIDC)
        # Pinned to a SHA so a malicious repoint can't substitute the action.
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Move Sigstore bundles aside
        # PyPI rejects non-distribution files in the upload directory, so we
        # park the keyless-signing bundles in a sibling folder. They are
        # attached to the release below, and kept as a run artifact too.
        run: |
          mkdir -p signatures
          shopt -s nullglob
          mv dist/*.sigstore dist/*.sigstore.json signatures/ 2>/dev/null || true
          ls -la signatures/

      - name: Attach signed distributions to the GitHub release
        # A workflow artifact expires and needs a login to download, so the
        # signatures were effectively unreachable: nobody could verify a
        # release. Attaching them to the release itself makes
        #   sigstore verify identity --bundle <file>.sigstore.json
        # something a user can actually run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Otacon ${GITHUB_REF_NAME#v}" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* signatures/* --clobber
          # release-drafter pre-creates this release as a draft; a draft isn't
          # listed on the Releases page even after assets land on it, so a tag
          # push here would otherwise publish to PyPI while the matching
          # GitHub release stayed invisible until someone noticed and
          # un-drafted it by hand.
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Upload Sigstore bundles as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sigstore-bundles
          path: signatures/

      - name: Publish to PyPI
        # Pinned to the v1.14.2 commit SHA — a mutable ref (release/v1) could be
        # repointed at malicious code. Bump the SHA + comment together.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
