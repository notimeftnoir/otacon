name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

# Least privilege by default; the publish job opts into the OIDC token it needs.
permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Requires a protected GitHub Environment named "pypi" (add reviewers there
    # to gate releases). Also where PyPI Trusted Publishing is configured.
    environment: pypi
    permissions:
      id-token: write   # OIDC token for PyPI Trusted Publishing (no API token needed)

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (c-ares for aiodns)
        run: sudo apt-get update && sudo apt-get install -y libc-ares-dev

      - name: Install dev extras (run tests before publish)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build distribution
        run: pip install build && python -m build

      - name: Sign distribution with Sigstore (keyless OIDC)
        # Pinned to a SHA so a malicious repoint can't substitute the action.
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46  # v3.0.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Move Sigstore bundles aside
        # PyPI rejects non-distribution files in the upload directory, so we
        # park the keyless-signing bundles in a sibling folder. They are
        # uploaded as a GitHub Actions artifact for verification.
        run: |
          mkdir -p signatures
          shopt -s nullglob
          mv dist/*.sigstore dist/*.sigstore.json signatures/ 2>/dev/null || true
          ls -la signatures/

      - name: Upload Sigstore bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sigstore-bundles
          path: signatures/

      - name: Publish to PyPI
        # Pinned to the v1.14.0 commit SHA — a mutable ref (release/v1) could be
        # repointed at malicious code. Bump the SHA + comment together.
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
