name: Dependency review

# Fails the PR when it introduces a dependency with a known vulnerability or an
# incompatible licence. Runs ONLY on PRs because the action diffs the lockfile
# between the base and the head ref.
on:
  pull_request:

# One run per ref: a new push cancels the superseded run rather than spending
# a runner on a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # so the action can leave a summary comment on the PR

jobs:
  review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Block PRs that introduce vulnerable / GPL deps
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # moderate, not high — a tool built around catching threats early
          # shouldn't wave through a moderate-severity dep itself.
          fail-on-severity: moderate
          # Otacon is MIT — keep copyleft transitives out of the dep graph.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
          comment-summary-in-pr: on-failure
