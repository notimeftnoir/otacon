name: actionlint

# Lints every workflow file in .github/workflows/ on every PR that touches one.
# Catches: invalid `uses:` refs, shellcheck issues in `run:`, deprecated `set-output`,
# malformed `if:` expressions, missing `permissions:` blocks, etc.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"

# One run per ref: a new push cancels the superseded run rather than spending
# a runner on a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download actionlint
        id: get_actionlint
        # Fetched by commit SHA (e11169d is tag v1.7.5) and checked against a
        # known digest before it runs: the script is executed as shell, so
        # pinning the ref alone still trusts whatever bytes come back.
        run: |
          curl -sSfL -o download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/e11169d0656294827d65370a3c76a2325406da85/scripts/download-actionlint.bash
          echo "99ab9f1d97c31c9a051e6902305f7ea9f48e7e7e1b0ee41f64aa831c86655168  download-actionlint.bash" | sha256sum -c -
          bash download-actionlint.bash
          rm -f download-actionlint.bash

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
