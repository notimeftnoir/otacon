name: actionlint

# Lints every workflow file in .github/workflows/ on every PR that touches one.
# Catches: invalid `uses:` refs, shellcheck issues in `run:`, deprecated `set-output`,
# malformed `if:` expressions, missing `permissions:` blocks, etc.
on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"

# One run per ref: a new push cancels the superseded run rather than spending
# a runner on a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download actionlint
        id: get_actionlint
        # Fetched by commit SHA, not by tag: a tag can be repointed, and this
        # script is piped straight into bash. e11169d is tag v1.7.5.
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/e11169d0656294827d65370a3c76a2325406da85/scripts/download-actionlint.bash)

      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
