name: Release Drafter

# Maintains a draft release on main with PR-driven changelog. The actual tag
# + PyPI publish lives in publish.yml.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

# One run per ref: a new push cancels the superseded run rather than spending
# a runner on a commit nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update_release_draft:
    name: Update draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write          # draft + autolabeling
      pull-requests: write
    steps:
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9  # v7.7.0
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
