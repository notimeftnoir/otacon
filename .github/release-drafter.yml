name-template: 'Otacon $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# How to bump $RESOLVED_VERSION based on PR labels.
version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['bug', 'fix', 'security', 'docs', 'chore', 'test', 'ci', 'build', 'dependencies']
  default: patch

exclude-labels: ['skip-changelog']

# Bucketed changelog sections.
categories:
  - title: '💥 Breaking changes'
    labels: ['breaking']
  - title: '🔒 Security'
    labels: ['security']
  - title: '✨ Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug fixes'
    labels: ['bug', 'fix']
  - title: '🧪 Tests'
    labels: ['test']
  - title: '🛠 CI & build'
    labels: ['ci', 'build', 'chore']
  - title: '📝 Docs'
    labels: ['docs']
  - title: '📦 Dependencies'
    labels: ['dependencies']
  - title: '🧹 Refactor'
    labels: ['refactor']

change-template: '- $TITLE (#$NUMBER) — @$AUTHOR'
change-title-escapes: '\<*_&'

# Convention-commit fallback labelling so unlabeled PRs still slot somewhere.
autolabeler:
  - label: 'security'
    title:
      - '/^security(\(.*\))?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?:/i'
  - label: 'test'
    title:
      - '/^test(\(.*\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.*\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?:/i'
  - label: 'build'
    title:
      - '/^build(\(.*\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
  - label: 'breaking'
    # A `feat!` in the commits does not reach the squashed PR title, so v3.0.0
    # resolved as a minor from 2.1.0 and the draft named itself 2.2.0. The body
    # matchers are anchored to the two forms that actually declare a break —
    # the conventional-commits footer and the bold lead-in this repo writes —
    # because a loose /breaking change/i would also fire on "not a breaking
    # change" and bump a major by accident. `publish.yml` compares the tag with
    # pyproject.toml either way, so this keeps the draft honest rather than
    # guarding the upload.
    title:
      - '/!:/'
    body:
      - '/^BREAKING[ -]CHANGE:/m'
      - '/^\*\*Breaking:?\*\*/im'

template: |
  ## What changed

  $CHANGES

  **Full diff**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  Verified release artefacts are SBOM-tagged (CycloneDX) and keyless-signed
  with Sigstore — see [SECURITY.md](https://github.com/$OWNER/$REPOSITORY/blob/main/SECURITY.md).
