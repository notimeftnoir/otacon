name-template: 'Otacon $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# How to bump $RESOLVED_VERSION based on PR labels.
version-resolver:
  major:
    labels: ['breaking']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['bug', 'fix', 'security', 'docs', 'chore', 'test', 'ci']
  default: patch

# Bucketed changelog sections.
categories:
  - title: '🔒 Security'
    labels: ['security']
  - title: '✨ Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug fixes'
    labels: ['bug', 'fix']
  - title: '🧪 Tests'
    labels: ['test']
  - title: '🛠 CI & build'
    labels: ['ci', 'build', 'chore']
  - title: '📝 Docs'
    labels: ['docs']
  - title: '🧹 Refactor'
    labels: ['refactor']

change-template: '- $TITLE (#$NUMBER) — @$AUTHOR'
change-title-escapes: '\<*_&'

# Convention-commit fallback labelling so unlabeled PRs still slot somewhere.
autolabeler:
  - label: 'security'
    title:
      - '/^security(\(.*\))?:/i'
  - label: 'feature'
    title:
      - '/^feat(\(.*\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\(.*\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\(.*\))?:/i'
  - label: 'test'
    title:
      - '/^test(\(.*\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\(.*\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\(.*\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\(.*\))?:/i'
  - label: 'breaking'
    title:
      - '/!:/'

template: |
  ## What changed

  $CHANGES

  **Full diff**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  Verified release artefacts are SBOM-tagged (CycloneDX) and keyless-signed
  with Sigstore — see [SECURITY.md](https://github.com/$OWNER/$REPOSITORY/blob/main/SECURITY.md).
